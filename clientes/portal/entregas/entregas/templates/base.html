<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block titulo %}Entregas{% endblock %} — Viral Media</title>
  <style>
    :root {
      --papel: #f3efe6;
      --tinta: #1d1a16;
      --apagado: #5e574c;
      --linha: #e2d9cc;
      --cartao: #fffdf8;
      --acento: #8f3d2b;
      --acento-escuro: #6e2d1f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.5 "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--tinta);
      background: var(--papel);
    }
    a { color: var(--acento-escuro); }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--acento);
      outline-offset: 2px;
    }
    .pular {
      position: absolute;
      left: -999px;
      background: white;
      color: var(--tinta);
      padding: 0.4rem 0.6rem;
    }
    .pular:focus { left: 0.5rem; top: 0.5rem; z-index: 2; }
    header.topo { background: var(--tinta); color: #f6f1e8; }
    header.topo a.marca { color: inherit; text-decoration: none; }
    .marca { font-family: Georgia, "Iowan Old Style", serif; font-size: 1.25rem; }
    .marca small {
      display: block;
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .topo-linha {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1.25rem 2.5rem; }
    h1 {
      font-family: Georgia, "Iowan Old Style", serif;
      font-weight: 500;
      font-size: 1.8rem;
      line-height: 1.2;
      margin: 0 0 0.4rem;
    }
    .meta { color: var(--apagado); margin: 0 0 1rem; }
    .cartao {
      background: var(--cartao);
      border: 1px solid var(--linha);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin: 0 0 0.75rem;
    }
    a.cartao {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    a.cartao:hover { border-color: #c9b8a4; }
    .linha { display: flex; justify-content: space-between; gap: 0.75rem; align-items: baseline; }
    .selo {
      display: inline-block;
      font-size: 0.75rem;
      line-height: 1.2;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      background: #e7e1d6;
      white-space: nowrap;
    }
    .selo.em_andamento { background: #f3e0c2; }
    .selo.em_revisao { background: #f6d6c9; }
    .selo.entregue { background: #d5e6d8; }
    .selo.pago { background: #d5e0ea; }
    .selo.cancelado { background: #ece7e0; color: #6b645b; }
    label { display: block; font-size: 0.95rem; margin-bottom: 0.85rem; }
    input[type="text"], input[type="password"] {
      display: block;
      width: 100%;
      margin-top: 0.3rem;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--linha);
      border-radius: 8px;
      background: white;
      font: inherit;
      color: inherit;
    }
    button, .botao {
      display: inline-block;
      background: var(--acento);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 0.6rem 0.95rem;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    button.secundario {
      background: transparent;
      color: #f6f1e8;
      border: 1px solid rgba(246, 241, 232, 0.45);
      padding: 0.35rem 0.7rem;
    }
    .erro, .erro-campo {
      background: #fde8e4;
      border: 1px solid #e7b2a8;
      color: #6e2d1f;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      margin-bottom: 0.8rem;
    }
    .erro ul { margin: 0; padding-left: 1.1rem; }
    .erro-campo { display: block; margin-top: 0.35rem; padding: 0.35rem 0.55rem; }
    ul.limpo { list-style: none; padding: 0; margin: 0; }
    ul.limpo li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 0;
      border-top: 1px solid var(--linha);
    }
    .mono { font-family: ui-monospace, "Cascadia Code", monospace; font-size: 0.92em; }
    footer {
      max-width: 40rem;
      margin: 0 auto;
      padding: 0 1.25rem 2rem;
      color: var(--apagado);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <a class="pular" href="#conteudo">Ir para o conteúdo</a>
  <header class="topo">
    <div class="topo-linha">
      <a class="marca" href="/">
        <small>Viral Media</small>
        Entregas
      </a>
      {% if request.cliente and request.user.is_authenticated %}
        <form method="post" action="{% url 'sair' %}">
          {% csrf_token %}
          <button class="secundario" type="submit">Sair</button>
        </form>
      {% endif %}
    </div>
  </header>
  <main id="conteudo">
    {% block conteudo %}{% endblock %}
  </main>
  <footer>Portal de entregas. Os arquivos ficam só na conta deste endereço.</footer>
</body>
</html>
