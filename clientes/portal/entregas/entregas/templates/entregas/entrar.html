{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
  <h1>Entrar</h1>
  <p class="meta">{{ request.cliente.nome_exibicao }}</p>
  <form class="cartao" method="post" action="{% url 'entrar' %}">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="erro" role="alert">{{ form.non_field_errors }}</div>
    {% endif %}
    {% for campo in form %}
      <label for="{{ campo.id_for_label }}">
        {{ campo.label }}
        {{ campo }}
        {% if campo.errors %}
          <span class="erro-campo" role="alert">{{ campo.errors|striptags }}</span>
        {% endif %}
      </label>
    {% endfor %}
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
