# Dominio principal: viralmedia.vip vai para o Traefik (projeto com HOSTS=viralmedia.vip,...);
# www.viralmedia.vip redireciona (301) para o dominio principal.
server {
    listen 80;
    listen 443 ssl;
    server_name www.viralmedia.vip;
    ssl_certificate /etc/nginx/projetos-fiver/ssl/origem.crt;
    ssl_certificate_key /etc/nginx/projetos-fiver/ssl/origem.key;
    return 301 https://viralmedia.vip$request_uri;
}
server {
    listen 80;
    listen 443 ssl;
    server_name viralmedia.vip;
    ssl_certificate /etc/nginx/projetos-fiver/ssl/origem.crt;
    ssl_certificate_key /etc/nginx/projetos-fiver/ssl/origem.key;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }
}
