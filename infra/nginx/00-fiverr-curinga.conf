# Qualquer <cliente>.viralmedia.vip sem bloco proprio vai para o Traefik (8100).
# A regex e gerada pelo setup-infra.sh excluindo os subdominios que ja tem site proprio.
server {
    listen 80;
    listen 443 ssl;
    server_name __REGEX__;
    ssl_certificate /etc/nginx/projetos-fiver/ssl/origem.crt;
    ssl_certificate_key /etc/nginx/projetos-fiver/ssl/origem.key;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
