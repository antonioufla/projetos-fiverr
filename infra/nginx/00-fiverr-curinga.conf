# Qualquer <cliente>.viralmedia.vip sem bloco proprio vai para o Traefik (8100).
# Sites existentes com server_name exato tem prioridade sobre esta regex.
server {
    listen 80;
    listen 443 ssl;
    server_name ~^(?<cliente>[a-z0-9-]+)\.viralmedia\.vip$;
    ssl_certificate /etc/nginx/projetos-fiver/ssl/origem.crt;
    ssl_certificate_key /etc/nginx/projetos-fiver/ssl/origem.key;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
