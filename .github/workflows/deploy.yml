name: Deploy clientes
on:
  push:
    branches: [main]
    paths: ['clientes/**', 'infra/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      alvo:
        description: 'cliente ou cliente/projeto (vazio = todos)'
        required: false
concurrency: deploy-servidor-133
jobs:
  deploy:
    runs-on: [self-hosted, projetos-fiverr]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Infra (Traefik + Nginx curinga)
        run: bash infra/deploy/setup-infra.sh
      - name: Descobrir projetos alterados
        id: alvos
        run: |
          todos() { find clientes -mindepth 2 -maxdepth 2 -type d ! -path 'clientes/_*' | cut -d/ -f2-3; }
          ALVO="${{ github.event.inputs.alvo }}"
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$ALVO" ]; then LISTA=$(todos)
            elif [[ "$ALVO" == */* ]]; then LISTA="$ALVO"
            else LISTA=$(todos | grep "^$ALVO/" || true); fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            LISTA=$(todos)
          else
            LISTA=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- clientes | awk -F/ 'NF>=4 && $2 !~ /^_/ {print $2"/"$3}' | sort -u)
          fi
          echo "Projetos: $LISTA"
          echo "lista=$(echo $LISTA)" >> "$GITHUB_OUTPUT"
      - name: Publicar
        run: |
          for P in ${{ steps.alvos.outputs.lista }}; do
            echo "::group::$P"; bash infra/deploy/deploy-projeto.sh "${P%%/*}" "${P##*/}"; echo "::endgroup::"
          done
