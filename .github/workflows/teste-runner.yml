name: Teste do runner
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/teste-runner.yml']
jobs:
  teste:
    runs-on: [self-hosted, projetos-fiverr]
    steps:
      - run: |
          echo "Usuario: $(whoami) em $(hostname)"
          docker --version
          docker compose version || echo "compose ausente"
          ls -ld /opt/projetos-fiver
          nginx -v 2>&1 || true
          ls /etc/nginx/sites-enabled /etc/nginx/conf.d 2>&1 | head -50
